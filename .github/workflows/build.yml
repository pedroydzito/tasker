name: Build

on:
  workflow_dispatch:
  push:
    branches: ["**"]

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: swift --version
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      # A interface do app é o build da web: tipos, build e E2E antes de compilar o Mac.
      - name: Web
        working-directory: web
        run: |
          npm ci
          npm run build
          npx -y playwright@1.49.1 install chromium
          npm i --no-save playwright@1.49.1
          npm run e2e
      - name: Compilar
        run: ./scripts/build-app.sh
        env:
          BUILD_NUMBER: ${{ github.run_number }}
      # Testa o app de ponta a ponta numa pasta isolada; se falhar, nada é publicado.
      - name: Autoteste
        run: |
          export TASKER_HOME="$RUNNER_TEMP/tasker-autoteste"
          rm -rf "$TASKER_HOME"
          build/Tasker.app/Contents/MacOS/Tasker --autoteste
      - name: Capturas de tela
        run: |
          export TASKER_HOME="$RUNNER_TEMP/tasker-capturas"
          rm -rf "$TASKER_HOME"
          build/Tasker.app/Contents/MacOS/Tasker --capturas build/capturas
      # Investigação: o caminho antigo de excluir nota. Pode falhar sem bloquear o release.
      - name: Reproduzir exclusão de nota (caminho antigo)
        continue-on-error: true
        run: |
          export TASKER_HOME="$RUNNER_TEMP/tasker-repro"
          rm -rf "$TASKER_HOME"
          build/Tasker.app/Contents/MacOS/Tasker --repro-exclusao-nota; echo "saída: $?"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: capturas
          path: build/capturas
          if-no-files-found: ignore
      - run: cd build && ditto -c -k --keepParent Tasker.app Tasker.zip
      # DMG para instalar arrastando o app até o atalho de Aplicativos.
      - name: Criar DMG
        run: |
          mkdir -p build/dmg
          cp -R build/Tasker.app build/dmg/
          ln -s /Applications build/dmg/Aplicativos
          hdiutil create -volname "Tasker" -srcfolder build/dmg -ov -format UDZO build/Tasker.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: Tasker
          path: |
            build/Tasker.dmg
            build/Tasker.zip
      # Cada build vira um release; o app instalado detecta e se atualiza sozinho.
      - name: Publicar release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v0.1.${{ github.run_number }}"
          gh release create "$TAG" build/Tasker.dmg build/Tasker.zip \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "Tasker $TAG" \
            --notes "$(git log -1 --pretty=%B)" \
            --latest
